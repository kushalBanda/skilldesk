name: Bug report
description: Something in SkillDesk is wrong or broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Found a security problem? Don't file it here; use **Report a vulnerability** on the Security tab.
        Please mask any paths, prompts, or keys you'd rather keep private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Skills
        2. Click Link on a skill for Cursor
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillDesk version
      description: Settings > App updates shows it. Or run `skilldesk --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.1, Apple M2"
    validations:
      required: true
  - type: checkboxes
    id: agents
    attributes:
      label: Agents involved
      options:
        - label: Claude Code
        - label: Cursor
        - label: Codex
        - label: OpenCode
        - label: Gemini CLI
        - label: GitHub Copilot CLI
        - label: Another agent (name it below)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, or anything else
      description: "`skilldesk scan --json` output can help. Check it for private paths first."
