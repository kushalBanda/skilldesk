[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
skilldesk-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ts-rs = "12"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
yaml_serde = "0.10"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7"
tempfile = "3"
toml = "1"
memchr = "2"
notify = "8"

# Dev builds: optimise dependencies and the core (transcript parsing is ~10x
# faster), keep the app crate quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.skilldesk-core]
opt-level = 2
